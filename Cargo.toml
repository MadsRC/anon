[package]
name = "anon_sdk"
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
description = "A high-performance, safe anonymization library for data privacy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/anon_sdk"
keywords = ["anonymization", "privacy", "ml", "data-protection"]
categories = ["algorithms", "science"]

[lib]
name = "anon_sdk"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "anon"
path = "src/main.rs"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[dependencies]
rayon = "1.8"
ndarray = "0.15"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
regex = "1.11"
clap = { version = "4.4", features = ["derive"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
# GLiNER NER dependencies
"gline-rs" = "1"
orp = "0.9"

[features]
default = []

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
serde_json = "1.0"
tempfile = "3.8"

